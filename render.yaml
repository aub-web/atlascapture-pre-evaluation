# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Values marked `sync: false` are entered in the Render dashboard (never committed).
# Also add a Secret File named `team.js` with the contents of your local config/team.js.
services:
  - type: web
    name: studio-setup-qc
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data   # SQLite database + uploaded photos live here
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: ROSTER_FILE
        value: /etc/secrets/team.js
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_DOMAINS
        value: atlascapture.io
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: APP_URL
        sync: false
      - key: SITE_PASSWORD
        sync: false
